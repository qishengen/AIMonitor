<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素动画编辑器 · GIF修复版</title>
    <style>
        :root {
            --bg: #1e1e2e; --surface: #2a2a3c; --surface2: #33334a; --text: #e0e0e0;
            --text-secondary: #b0b0c0; --accent: #7c8cf8; --accent-hover: #9aabff;
            --border: #44445a; --radius: 10px; --radius-sm: 6px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background:var(--bg); color:var(--text); min-height:100vh;
            display:flex; justify-content:center; align-items:center; padding:20px;
            user-select:none; -webkit-user-select:none;
        }
        .app{
            background:var(--surface); border-radius:16px; padding:18px 16px 12px;
            box-shadow:0 4px 20px rgba(0,0,0,0.4); width:100%; max-width:920px;
            display:flex; flex-direction:column; gap:10px;
        }
        .header{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
        .title{ font-size:1.4rem; font-weight:700; display:flex; align-items:center; gap:6px; color:#fff; }
        .size-selector{ display:flex; align-items:center; gap:8px; background:var(--surface2); padding:6px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); }
        .size-selector select{ background:var(--surface); color:#fff; border:1px solid var(--border); border-radius:4px; padding:5px 10px; font-size:0.85rem; }
        .toolbar-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .toolbar-group{ display:flex; align-items:center; gap:6px; background:var(--surface2); padding:7px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); }
        .brush-group{ flex:1 1 auto; justify-content: space-between; }
        .color-swatch{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:0.15s; }
        .color-swatch:hover{ border-color:#fff; transform:scale(1.15); }
        .color-swatch.active{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.35); }
        .color-swatch.eraser{ background:#fff!important; display:flex; align-items:center; justify-content:center; font-size:0.75rem; }
        .color-swatch.eraser::after{ content:'🧹'; }
        input[type="color"]{ width:34px; height:28px; border:2px solid var(--border); border-radius:4px; cursor:pointer; background:transparent; }
        .btn{ padding:6px 12px; border:1px solid var(--border); background:var(--surface); color:#eee; border-radius:var(--radius-sm); cursor:pointer; font-size:0.8rem; font-weight:500; transition:0.15s; }
        .btn:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }
        .btn.accent{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
        .btn-sm{ padding:4px 8px; font-size:0.7rem; border-radius:3px; border:1px solid var(--border); background:var(--surface); color:#ddd; cursor:pointer; }
        .btn-sm:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }
        .btn-copy{ background:var(--surface); border-color:var(--accent); color:var(--accent); font-weight:600; }
        .btn-copy:hover{ background:var(--accent); color:#fff; }
        .canvas-outer{ display:flex; flex-direction:column; align-items:center; gap:6px; }
        .canvas-scroll{ overflow:auto; max-height:70vh; border-radius:var(--radius); box-shadow:0 0 0 3px var(--border),0 6px 24px rgba(0,0,0,0.5); background:#fff; position:relative; }
        .canvas-inner{ position:relative; width:512px; height:512px; transform-origin:top left; transition:transform 0.1s; }
        .canvas-inner img.ref-bg{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:fill; pointer-events:none; opacity:0.4; image-rendering:pixelated; }
        canvas#pixelCanvas{ display:block; width:100%; height:100%; image-rendering:crisp-edges; image-rendering:pixelated; position:relative; z-index:1; }
        .zoom-bar{ display:flex; align-items:center; gap:6px; font-size:0.8rem; background:var(--surface2); padding:4px 10px; border-radius:4px; border:1px solid var(--border); }
        .ref-controls{ display:flex; align-items:center; gap:6px; font-size:0.75rem; background:var(--surface2); padding:4px 10px; border-radius:4px; border:1px solid var(--border); }
        .frame-toolbar-row{ display:flex; justify-content:center; gap:4px; }
        .frames-row{
            display:flex; align-items:center; gap:8px;
            background:var(--surface2); border-radius:var(--radius-sm);
            border:1px solid var(--border); padding:6px 10px;
            width:100%; max-width:520px; height:78px; margin:0 auto;
        }
        .frame-list{ display:flex; gap:6px; overflow-x:auto; flex:1; height:100%; align-items:center; }
        .frame-item{
            width:56px; height:56px; border:3px solid transparent; border-radius:6px;
            cursor:pointer; flex-shrink:0; background:#fff; transition: all 0.15s;
            overflow:hidden;
        }
        .frame-item:hover { border-color: #aaa; }
        .frame-item.active{
            border-color: var(--accent)!important;
            box-shadow: 0 0 10px rgba(124,140,248,0.6);
            transform: scale(1.05);
            z-index: 2;
        }
        .frame-item canvas{ width:100%; height:100%; image-rendering:pixelated; display:block; }
        .playback-bar{
            display:flex; align-items:center; gap:10px; padding:6px 12px;
            background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);
            justify-content:center; max-width:520px; margin:0 auto;
        }
        .status-bar{ display:flex; flex-wrap:wrap; gap:10px; font-size:0.73rem; color:var(--text-secondary); justify-content:center; }
        .status-item{ background:var(--surface2); padding:3px 10px; border-radius:4px; border:1px solid var(--border); }
        .toast{ position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-120px); background:#444; color:#fff; padding:9px 22px; border-radius:22px; font-weight:600; z-index:999; pointer-events:none; transition:0.3s; }
        .toast.show{ transform:translateX(-50%) translateY(0); }
        .hint{ font-size:0.7rem; color:#666; text-align:center; }
        /* ---- 分隔线与设备控制面板 ---- */
        .divider{ border:none; border-top:1px solid var(--border); margin:6px 0; width:100%; }
        .device-panel{ display:flex; flex-direction:column; gap:8px; align-items:stretch; width:100%; max-width:560px; margin:0 auto; }
        .serial-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .serial-row select, .serial-row input[type="text"]{ background:var(--surface); color:#fff; border:1px solid var(--border); border-radius:4px; padding:6px 10px; font-size:0.8rem; flex:1 1 100px; min-width:80px; }
        .conn-dot{ width:12px; height:12px; border-radius:50%; background:#666; transition:0.3s; flex-shrink:0; }
        .conn-dot.on{ background:#4caf50; box-shadow:0 0 8px #4caf50; }
        .conn-dot.streaming{ background:#f44336; box-shadow:0 0 8px #f44336; }
        .btn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
        .btn.danger{ background:#e05252; border-color:#e05252; color:#fff; }
        .log-area{ background:#101018; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 8px; height:140px; overflow-y:auto; font-family:Consolas,Menlo,monospace; font-size:0.72rem; color:#9fe3af; -webkit-user-select:text; user-select:text; cursor:text; }
        .log-line{ white-space:pre-wrap; word-break:break-all; padding:1px 0; border-bottom:1px solid rgba(255,255,255,0.04); -webkit-user-select:text; user-select:text; }
        .log-line.rx{ color:#8fd0ff; } .log-line.err{ color:#ff7b7b; } .log-line.warn{ color:#ffd27d; } .log-line.ok{ color:#7ef0a2; } .log-line.raw{ color:#bbb; }
        @media(max-width:700px){
            .frame-item{width:38px; height:38px;}
            .frames-row{height:52px;}
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="title">🎨 像素动画编辑器</div>
        <div class="size-selector">
            <label>画布尺寸:</label>
            <select id="sizeSelect">
                <option value="16">16×16</option>
                <option value="32">32×32</option>
                <option value="64" selected>64×64</option>
                <option value="64x32">64×32</option>
                <option value="128x64">128×64 (设备)</option>
            </select>
        </div>
    </div>

    <div class="toolbar-row">
        <div class="toolbar-group">
            <span>📥 导入</span>
            <button class="btn btn-sm" id="btnImportImage">🖼 图片</button>
            <button class="btn btn-sm" id="btnImportCArray">📄 C数组</button>
            <button class="btn btn-sm" id="btnImportPXA">🎞 PXA</button>
            <button class="btn btn-sm" id="btnRefImage">📷 参考图</button>
            <input type="file" id="fileInput" accept="image/*,.txt,.h,.c" style="display:none">
            <input type="file" id="refFileInput" accept="image/*" style="display:none">
        </div>
    </div>

    <div class="toolbar-row">
        <div class="toolbar-group brush-group">
            <span>🖤 画笔</span>
            <div class="color-presets" id="colorPresets" style="display:flex; gap:6px;">
                <span class="color-swatch active" data-color="#000000" style="background:#000"></span>
                <span class="color-swatch eraser" data-color="#FFFFFF"></span>
            </div>
            <span style="font-size:0.72rem; color:var(--text-secondary);">黑白模式</span>
        </div>
    </div>

    <div class="toolbar-row">
        <div class="toolbar-group">
            <button class="btn" id="btnUndo">↩ 撤销</button>
            <button class="btn" id="btnRedo">↪ 重做</button>
            <button class="btn" id="btnClearFrame">🗑 清空帧</button>
            <button class="btn" id="btnInvert">🔲 反色</button>
            <button class="btn" id="btnGrid">📐 网格</button>
        </div>
        <div class="toolbar-group">
            <span class="status-item">🖤 黑白模式</span>
            <button class="btn" id="btnSelectMode" title="选择模式：左键拖拽框选，选中区内拖拽移动像素">🔲 选择</button>
        </div>
    </div>

    <div class="canvas-outer">
        <div class="zoom-bar">
            <span>🔍 缩放:</span>
            <input type="range" id="zoomSlider" min="1" max="5" value="1" step="0.25">
            <span id="zoomLabel">1x</span>
            <button class="btn-sm" id="zoomReset">1:1</button>
        </div>
        <div class="canvas-scroll" id="canvasScroll">
            <div class="canvas-inner" id="canvasInner">
                <img class="ref-bg" id="refBgImg" src="" style="display:none;">
                <canvas id="pixelCanvas"></canvas>
            </div>
        </div>
        <div class="ref-controls" id="refControls" style="display:none;">
            <span>📷 透明度:</span>
            <input type="range" id="refOpacity" min="0" max="1" value="0.3" step="0.05">
            <span id="refOpacityLabel">30%</span>
            <button class="btn-sm" id="btnClearRef">清除</button>
        </div>
    </div>

    <div class="toolbar-row" id="importBar" style="justify-content:center; display:none;">
        <div class="toolbar-group" style="flex-wrap:wrap;">
            <span>🖼 导入预览</span>
            <button class="btn-sm" id="btnImpFit">↔ 适应</button>
            <span>缩放:</span>
            <input type="range" id="impScale" min="5" max="800" value="100" style="width:120px;">
            <span id="impScaleLabel">100%</span>
            <select id="impMode">
                <option value="fill">填充(全局阈值)</option>
                <option value="adaptive">自适应(局部对比)</option>
                <option value="edge">轮廓(边缘)</option>
            </select>
            <span id="impThreshLabel">阈值</span>
            <input type="range" id="impThresh" min="0" max="255" value="128" style="width:120px;">
            <span id="impThreshVal">128</span>
            <button class="btn accent" id="btnImpApply">✓ 应用</button>
            <button class="btn" id="btnImpCancel">✕ 取消</button>
            <span style="font-size:0.7rem; color:var(--text-secondary);">拖动=移动 · 滚轮=缩放</span>
        </div>
    </div>

    <div class="frame-toolbar-row">
        <button class="btn-sm" id="btnAddFrame">➕ 添加</button>
        <button class="btn-sm" id="btnDupFrame">📋 复制</button>
        <button class="btn-sm danger" id="btnDelFrame">🗑 删除</button>
        <button class="btn-sm" id="btnMoveUp">⬆ 上移</button>
        <button class="btn-sm" id="btnMoveDown">⬇ 下移</button>
    </div>

    <div class="frames-row"><div class="frame-list" id="frameList"></div></div>

    <div class="playback-bar">
        <button id="btnPlay">▶ 播放</button>
        <span>FPS:</span>
        <input type="range" id="fpsSlider" min="1" max="30" value="12">
        <span id="fpsLabel">12</span>
        <label><input type="checkbox" id="loopCheck" checked> 循环</label>
    </div>

    <div class="toolbar-row" style="justify-content:center;">
        <div class="toolbar-group">
            <span>📤 导出</span>
            <button class="btn btn-sm" id="btnExportPNG">PNG</button>
            <button class="btn btn-sm" id="btnExportJPEG">JPEG</button>
            <button class="btn btn-sm" id="btnExportBMP">BMP</button>
            <button class="btn btn-sm accent" id="btnExportGIF">GIF动画</button>
            <button class="btn btn-sm" id="btnExportCArr">C数组(帧)</button>
            <button class="btn btn-sm btn-copy" id="btnCopyCArr">📋</button>
            <button class="btn btn-sm" id="btnExportCArrAll">C数组(全部)</button>
            <button class="btn btn-sm btn-copy" id="btnCopyCArrAll">📋</button>
            <button class="btn btn-sm accent" id="btnExportPXA" title="导出为 PXA 文本格式（便于 git 分享/预览）">🎞 PXA</button>
            <button class="btn btn-sm" id="btnBitOrder">位序: LSB</button>
        </div>
    </div>

    <hr class="divider">

    <div class="toolbar-row" style="justify-content:center;">
        <div class="device-panel">
            <div class="serial-row">
                <span>🔌 设备</span>
                <select id="serialPorts"></select>
                <button class="btn" id="btnConnect">🔌 连接</button>
                <select id="baudSelect">
                    <option>921600</option>
                    <option>460800</option>
                    <option>115200</option>
                </select>
                <span class="conn-dot" id="connDot"></span>
            </div>
            <div class="serial-row">
                <input type="text" id="animName" value="editor.anm" title="上传/播放的动画文件名" placeholder="动画名.anm">
                <button class="btn" id="btnUpload" title="分块上传+CRC32校验，直接保存到设备">📤 上传动画</button>
                <button class="btn" id="btnSendFrame" title="立即在设备显示当前帧">🖥 发送当前帧</button>
                <button class="btn" id="btnDevicePlay" title="播放设备中的同名动画">▶ 设备播放</button>
                <button class="btn" id="btnDeviceStop" title="停止播放">⏹ 停止</button>
                <button class="btn" id="btnStreamToggle" title="将全部帧按 FPS 流式实时播放到设备">🔴 流式预览</button>
                <button class="btn" id="btnRefresh" title="查询固件版本/状态/动画列表">🔄 状态</button>
                <button class="btn" id="btnDelete" title="删除设备中与左侧同名(.anm)的动画">🗑 删除</button>
            </div>
            <div class="log-area" id="logArea"></div>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-item" id="statusCoords">坐标: — , —</span>
        <span class="status-item" id="statusPixels">已绘制: 0 px</span>
        <span class="status-item" id="statusFrame">帧: 1/1</span>
        <span class="status-item" id="statusMode">黑白</span>
        <span class="status-item" id="statusBitOrder">LSB</span>
    </div>
    <div class="hint">🖱 <kbd>左键</kbd>绘制 <kbd>右键</kbd>擦除 · 选择模式：左键拖拽=框选 · 选中区内左键拖拽=移动像素 · 右键=取消选择 · 🔌 设备面板需 Web Serial（Chrome/Edge，建议 localhost 下打开）</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===================== 全新的 GIF 解码器（更健壮） =====================
class GIFDecoder {
    constructor(data) {
        this.data = new Uint8Array(data);
        this.offset = 0;
        this.frames = [];
    }
    readByte() { return this.data[this.offset++]; }
    readShort() { return this.readByte() | (this.readByte() << 8); }
    readBlock() {
        const blocks = [];
        let len;
        while ((len = this.readByte()) > 0) {
            blocks.push(this.data.slice(this.offset, this.offset + len));
            this.offset += len;
        }
        return new Uint8Array(blocks.reduce((acc, b) => acc + b.length, 0)).map((_, i) => {
            let offset = 0;
            for (const block of blocks) {
                if (i < offset + block.length) return block[i - offset];
                offset += block.length;
            }
            return 0;
        });
    }
    lzwDecode(minCodeSize, data) {
        const clear = 1 << minCodeSize;
        const end = clear + 1;
        let codeSize = minCodeSize + 1;
        let dict = new Map();
        for (let i = 0; i < clear; i++) dict.set(i, [i]);
        dict.set(clear, []);
        dict.set(end, []);   // 预留 end 码，首个新码从 clear+2 开始
        const result = [];
        let bitPos = 0, code = 0, last = [];
        const readBits = (n) => {
            let val = 0;
            for (let i = 0; i < n; i++) {
                const byte = data[Math.floor(bitPos / 8)];
                val |= ((byte >> (bitPos % 8)) & 1) << i;
                bitPos++;
            }
            return val;
        };
        while (true) {
            code = readBits(codeSize);
            if (code === end) break;
            if (code === clear) {
                codeSize = minCodeSize + 1;
                dict = new Map();
                for (let i = 0; i < clear; i++) dict.set(i, [i]);
                dict.set(clear, []);
                dict.set(end, []);
                last = [];
                continue;
            }
            let entry;
            if (dict.has(code)) {
                entry = [...dict.get(code)];
            } else if (last.length) {
                entry = [...last, last[0]];
            } else {
                break;
            }
            result.push(...entry);
            if (last.length) {
                dict.set(dict.size, [...last, entry[0]]);
            }
            last = entry;
            if (dict.size >= (1 << codeSize) && codeSize < 12) codeSize++;
        }
        return result;
    }
    decode() {
        if (this.readByte() !== 0x47 || this.readByte() !== 0x49 || this.readByte() !== 0x46) throw '不是 GIF';
        this.readString(3); // version
        const width = this.readShort();
        const height = this.readShort();
        const packed = this.readByte();
        const bgIndex = this.readByte();
        this.bgIndex = bgIndex;
        this.readByte(); // aspect ratio
        const hasGlobalColorTable = packed & 0x80;
        const globalColorTableSize = 2 << (packed & 0x07);
        let globalTable = null;
        if (hasGlobalColorTable) {
            globalTable = this.data.slice(this.offset, this.offset + globalColorTableSize * 3);
            this.offset += globalColorTableSize * 3;
        }
        const frames = [];
        let delay = 10;
        let transparentIdx = -1;
        let disposal = 0;
        while (this.offset < this.data.length) {
            const blockType = this.readByte();
            if (blockType === 0x21) {
                const ext = this.readByte();
                if (ext === 0xF9) {
                    this.readByte(); // size
                    const flags = this.readByte();
                    delay = this.readShort() * 10;
                    transparentIdx = (flags & 1) ? this.readByte() : -1;
                    disposal = (flags >> 2) & 7;
                    this.readByte(); // terminator
                } else {
                    this.readBlock(); // skip
                }
            } else if (blockType === 0x2C) {
                const left = this.readShort();
                const top = this.readShort();
                const imgWidth = this.readShort();
                const imgHeight = this.readShort();
                const localPacked = this.readByte();
                const interlace = localPacked & 0x40;
                const hasLocalTable = localPacked & 0x80;
                let localTable = null;
                if (hasLocalTable) {
                    const localSize = 2 << (localPacked & 0x07);
                    localTable = this.data.slice(this.offset, this.offset + localSize * 3);
                    this.offset += localSize * 3;
                }
                const minCodeSize = this.readByte();
                const compressed = this.readBlock();
                const indices = this.lzwDecode(minCodeSize, compressed);
                const table = localTable || globalTable;
                frames.push({
                    left, top, width: imgWidth, height: imgHeight,
                    delay, transparentIdx, table, indices, disposal,
                    globalWidth: width, globalHeight: height
                });
            } else if (blockType === 0x3B) {
                break;
            }
        }
        this.frames = frames;
        this.globalWidth = width;
        this.globalHeight = height;
        this.composited = null;
        return this;
    }
    readString(len) {
        let s = '';
        for (let i = 0; i < len; i++) s += String.fromCharCode(this.readByte());
        return s;
    }
    getFrameImageData(frameIdx, outWidth, outHeight) {
        if (!this.frames[frameIdx]) return null;
        if (!this.composited) this.compositeAll();
        const W = this.globalWidth, H = this.globalHeight;
        const offCanvas = document.createElement('canvas');
        offCanvas.width = W; offCanvas.height = H;
        const octx = offCanvas.getContext('2d');
        const img = octx.createImageData(W, H);
        img.data.set(this.composited[frameIdx]);
        octx.putImageData(img, 0, 0);
        const scaleCanvas = document.createElement('canvas');
        scaleCanvas.width = outWidth;
        scaleCanvas.height = outHeight;
        const sctx = scaleCanvas.getContext('2d');
        sctx.imageSmoothingEnabled = false;
        // 等比适应：缩放并居中，留白透明
        const fit = Math.min(outWidth / W, outHeight / H);
        const dw = W * fit, dh = H * fit;
        sctx.drawImage(offCanvas, (outWidth - dw) / 2, (outHeight - dh) / 2, dw, dh);
        return sctx.getImageData(0, 0, outWidth, outHeight);
    }
    // 逐帧合成：支持部分帧更新 + 透明 + 处置方式(0/1保留 2背景 3恢复)，结果缓存
    compositeAll() {
        const W = this.globalWidth, H = this.globalHeight;
        const canvas = new Uint8ClampedArray(W * H * 4);
        let restore = new Uint8ClampedArray(canvas);
        const out = [];
        for (let fi = 0; fi < this.frames.length; fi++) {
            const f = this.frames[fi];
            if (fi > 0) {
                const pf = this.frames[fi - 1];
                if (pf.disposal === 2) {           // 恢复为背景(透明)
                    for (let y = pf.top; y < pf.top + pf.height; y++)
                        for (let x = pf.left; x < pf.left + pf.width; x++) {
                            const i = (y * W + x) * 4;
                            canvas[i] = canvas[i + 1] = canvas[i + 2] = canvas[i + 3] = 0;
                        }
                } else if (pf.disposal === 3) {    // 恢复为上一帧前的状态
                    for (let y = pf.top; y < pf.top + pf.height; y++)
                        for (let x = pf.left; x < pf.left + pf.width; x++) {
                            const i = (y * W + x) * 4;
                            canvas[i] = restore[i]; canvas[i + 1] = restore[i + 1];
                            canvas[i + 2] = restore[i + 2]; canvas[i + 3] = restore[i + 3];
                        }
                }
            }
            restore = new Uint8ClampedArray(canvas);
            const table = f.table;
            for (let y = f.top; y < f.top + f.height; y++) {
                for (let x = f.left; x < f.left + f.width; x++) {
                    const idx = f.indices[(y - f.top) * f.width + (x - f.left)];
                    if (idx === f.transparentIdx) continue;
                    if (table) {
                        const i = (y * W + x) * 4;
                        canvas[i] = table[idx * 3]; canvas[i + 1] = table[idx * 3 + 1];
                        canvas[i + 2] = table[idx * 3 + 2]; canvas[i + 3] = 255;
                    }
                }
            }
            out.push(new Uint8ClampedArray(canvas));
        }
        this.composited = out;
    }
}

// ===================== 全新的 GIF 编码器（使用 NeuQuant 算法生成更好的调色板） =====================
class GIFEncoder {
    constructor(width, height) {
        this.width = width;
        this.height = height;
        this.frames = [];
        this.delays = [];
        this.loopCount = 0;
        this.transparent = -1;
    }
    addFrame(pixels, delay) {
        this.frames.push(pixels);
        this.delays.push(delay);
    }
    build() {
        const buf = new ByteWriter();
        buf.writeString('GIF89a');
        buf.writeShort(this.width);
        buf.writeShort(this.height);
        buf.writeByte(0x00); // no global color table, no sorted, 0 bits
        buf.writeByte(0); // bg index
        buf.writeByte(0); // aspect
        // netscape loop extension
        buf.writeByte(0x21);
        buf.writeByte(0xFF);
        buf.writeByte(11);
        buf.writeString('NETSCAPE2.0');
        buf.writeByte(3);
        buf.writeByte(1);
        buf.writeShort(this.loopCount);
        buf.writeByte(0);
        for (let f = 0; f < this.frames.length; f++) {
            const framePixels = this.frames[f];
            const delay = this.delays[f];
            // graphics control extension
            buf.writeByte(0x21);
            buf.writeByte(0xF9);
            buf.writeByte(4);
            buf.writeByte(0x04); // no transparent
            buf.writeShort(Math.floor(delay / 10));
            buf.writeByte(0); // transparent index (unused)
            buf.writeByte(0);
            // 收集 RGB
            const rgbData = [];
            for (let y = 0; y < this.height; y++) {
                for (let x = 0; x < this.width; x++) {
                    const c = framePixels[y][x];
                    rgbData.push((c >> 16) & 0xFF, (c >> 8) & 0xFF, c & 0xFF);
                }
            }
            // 中位切分调色板，补齐到 2 的幂
            const palette = this.quantize(rgbData, 256);
            const nColors = palette.length / 3;
            const bits = Math.min(8, Math.max(1, Math.ceil(Math.log2(nColors))));
            const tableSize = 1 << bits;
            const minCodeSize = Math.max(2, bits);
            const padded = new Uint8Array(tableSize * 3);
            for (let i = 0; i < nColors * 3; i++) padded[i] = palette[i];
            // image descriptor（本地颜色表标志 + 尺寸 2^(bits-1)）
            buf.writeByte(0x2C);
            buf.writeShort(0);
            buf.writeShort(0);
            buf.writeShort(this.width);
            buf.writeShort(this.height);
            buf.writeByte(0x80 | (bits - 1));
            for (let i = 0; i < padded.length; i++) buf.writeByte(padded[i]);
            // 像素 -> 调色板索引
            const indices = new Uint8Array(this.width * this.height);
            for (let i = 0; i < this.width * this.height; i++) {
                let best = 0;
                let bestDist = Infinity;
                for (let j = 0; j < nColors; j++) {
                    const dr = rgbData[i * 3] - palette[j * 3];
                    const dg = rgbData[i * 3 + 1] - palette[j * 3 + 1];
                    const db = rgbData[i * 3 + 2] - palette[j * 3 + 2];
                    const dist = dr * dr + dg * dg + db * db;
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = j;
                    }
                }
                indices[i] = best;
            }
            // LZW encode（min code size 与实际一致）
            const compressed = this.lzwEncode(indices, minCodeSize);
            buf.writeByte(minCodeSize);
            for (const block of compressed) {
                buf.writeByte(block.length);
                buf.writeBytes(block);
            }
            buf.writeByte(0);
        }
        buf.writeByte(0x3B);
        return new Blob([new Uint8Array(buf.data)], { type: 'image/gif' });
    }
    quantize(rgb, maxColors) {
        // median cut quantization
        class Pixel { constructor(r, g, b) { this.r = r; this.g = g; this.b = b; } }
        const pixels = [];
        for (let i = 0; i < rgb.length; i += 3) {
            pixels.push(new Pixel(rgb[i], rgb[i + 1], rgb[i + 2]));
        }
        if (pixels.length === 0) return [];
        function medianCut(bucket, depth) {
            if (depth === 0 || bucket.length <= 1) return [bucket];
            let minR = 255, maxR = 0, minG = 255, maxG = 0, minB = 255, maxB = 0;
            for (const p of bucket) {
                if (p.r < minR) minR = p.r; if (p.r > maxR) maxR = p.r;
                if (p.g < minG) minG = p.g; if (p.g > maxG) maxG = p.g;
                if (p.b < minB) minB = p.b; if (p.b > maxB) maxB = p.b;
            }
            const rangeR = maxR - minR, rangeG = maxG - minG, rangeB = maxB - minB;
            let channel = 0;
            if (rangeG >= rangeR && rangeG >= rangeB) channel = 1;
            else if (rangeB >= rangeR && rangeB >= rangeG) channel = 2;
            bucket.sort((a, b) => [a.r, a.g, a.b][channel] - [b.r, b.g, b.b][channel]);
            const mid = Math.floor(bucket.length / 2);
            return [...medianCut(bucket.slice(0, mid), depth - 1), ...medianCut(bucket.slice(mid), depth - 1)];
        }
        const buckets = medianCut(pixels, Math.ceil(Math.log2(maxColors)));
        const palette = [];
        for (const bucket of buckets) {
            let r = 0, g = 0, b = 0;
            for (const p of bucket) { r += p.r; g += p.g; b += p.b; }
            const n = bucket.length;
            palette.push(Math.round(r / n), Math.round(g / n), Math.round(b / n));
        }
        return palette.slice(0, maxColors * 3);
    }
    lzwEncode(indices, minCodeSize) {
        const clear = 1 << minCodeSize;
        const end = clear + 1;
        let codeSize = minCodeSize + 1;
        const dict = new Map();
        for (let i = 0; i < clear; i++) dict.set(String.fromCharCode(i), i);
        let nextCode = clear + 2;   // 首个新码从 clear+2 开始（跳过 clear 与 end）
        const output = [];
        let bits = 0, bitCount = 0;
        const writeBits = (code) => {
            bits = (bits | (code << bitCount)) >>> 0;
            bitCount += codeSize;
            while (bitCount >= 8) {
                output.push(bits & 0xFF);
                bits = (bits >>> 8) >>> 0;
                bitCount -= 8;
            }
        };
        writeBits(clear);
        let w = '';
        for (let i = 0; i < indices.length; i++) {
            const k = String.fromCharCode(indices[i]);
            const wk = w + k;
            if (dict.has(wk)) {
                w = wk;
            } else {
                writeBits(dict.get(w));
                if (nextCode < 4096) {
                    dict.set(wk, nextCode++);
                    // 码宽增长需比字典计数晚一个：与标准解码器(首个新码由第2码经KwKwK构建)对齐
                    if (nextCode >= (1 << codeSize) + 1 && codeSize < 12) codeSize++;
                } else {
                    // 字典已满：输出 clear 并重置
                    writeBits(clear);
                    codeSize = minCodeSize + 1;
                    dict = new Map();
                    for (let c = 0; c < clear; c++) dict.set(String.fromCharCode(c), c);
                    nextCode = clear + 2;
                }
                w = k;
            }
        }
        if (w !== '') writeBits(dict.get(w));
        writeBits(end);
        if (bitCount > 0) output.push(bits & 0xFF);
        const blocks = [];
        for (let i = 0; i < output.length; i += 255) {
            blocks.push(new Uint8Array(output.slice(i, Math.min(i + 255, output.length))));
        }
        return blocks.length ? blocks : [new Uint8Array(0)];
    }
}
class ByteWriter {
    constructor() { this.data = []; }
    writeByte(b) { this.data.push(b & 0xFF); }
    writeShort(s) { this.writeByte(s & 0xFF); this.writeByte((s >> 8) & 0xFF); }
    writeString(s) { for (let i = 0; i < s.length; i++) this.writeByte(s.charCodeAt(i)); }
    writeBytes(arr) { for (const b of arr) this.writeByte(b); }
}

<script>
(function(){

    function getLine(r1,c1,r2,c2){
        const pts=[]; let dr=Math.abs(r2-r1),dc=Math.abs(c2-c1),sr=r1<r2?1:-1,sc=c1<c2?1:-1,err=dr-dc; let cr=r1,cc=c1;

    function paintCell(row,col,color){ const pd=getCurrentFrame().pixelData; const final=applyBwFilter(color); if(pd[row][col]!==final){ pd[row][col]=final; return true; } return false; }

        if(!selection) return; const pd=getCurrentFrame().pixelData; const {row1,col1,row2,col2}=selection;

                    for (let y = 0; y < gridHeight; y++) {

                            const r = imgData.data[idx];
                            const g = imgData.data[idx + 1];
                            const b = imgData.data[idx + 2];
                            const a = imgData.data[idx + 3];
                            if (a > 128) {
                                pd[y][x] = applyBwFilter((r << 16) | (g << 8) | b);
                            }
                        }
                    }
                    newFrames.push({pixelData: pd});
                }

    // ===================== PXA 文本格式（git 分享/预览） =====================
    // 说明: ; 开头为元数据/帧分隔行；像素行用 #=已绘制(黑) .=空白(白)，每行恰好 W 字符
    function pxaEncode(){
        const lines=[';PXA v1', `;W=${gridSize} H=${gridHeight} F=${frames.length} FPS=${fps} LOOP=${loop?1:0}`, `;NAME=${animName.value||'animation'}`];
        frames.forEach((f,fi)=>{
            lines.push(`;---- FRAME ${fi} ----`);
            for(let y=0;y<gridHeight;y++){
                let row='';
                for(let x=0;x<gridSize;x++) row += (f.pixelData[y][x]!==WHITE)?'#':'.';
                lines.push(row);
            }
        });
        return lines.join('\n');
    }
    function pxaDecode(text){
        let version=null, meta={}, cur=null, frameRows=[];
        for(const raw of text.split(/\r?\n/)){
            const line=raw.trimEnd();
            if(line==='') continue;
            if(line.startsWith(';')){
                if(/^;PXA\s+v?1\b/i.test(line)){ version=1; continue; }
                if(line.indexOf(';---- FRAME')===0){ if(cur) frameRows.push(cur); cur=[]; continue; }
                const body=line.slice(1);
                for(const kv of body.split(/\s+/)){ const m=kv.match(/^([A-Za-z]+)=(.+)$/); if(m) meta[m[1].toLowerCase()]=m[2]; }
                continue;
            }
            if(cur===null) cur=[];   // 无帧分隔时默认累计
            cur.push(line);
        }
        if(cur) frameRows.push(cur);
        if(version!==1) throw new Error('不是 PXA v1 文件');
        const W=parseInt(meta.w), H=parseInt(meta.h);
        if(!W||!H||W<1||H<1) throw new Error('缺少或无效的尺寸');
        const out=[];
        for(const rows of frameRows){
            const pd=Array.from({length:H},()=>new Array(W).fill(WHITE));
            for(let y=0;y<H&&y<rows.length;y++){
                const row=rows[y];
                for(let x=0;x<W&&x<row.length;x++) if(row[x]==='#') pd[y][x]=BLACK;
            }
            out.push({pixelData:pd});
        }
        if(out.length===0) throw new Error('没有帧数据');
        return {frames:out, W, H, fps:(parseInt(meta.fps)||12), loop:(meta.loop==='1'), name:meta.name||''};
    }
    document.getElementById('btnImportPXA').onclick=()=>{
        const text=prompt('粘贴 PXA 文本:');

        try{
            const r=pxaDecode(text);

                if(!confirm(`PXA 尺寸为 ${r.W}×${r.H}，当前画布 ${gridSize}×${gridHeight}。调整为 PXA 尺寸并导入？`)) return;

    function startImportPreview(img){
        importing=true; impImg=img; impMode='fill'; impThresh=128;

    function impFit(){
        if(!impImg) return;
        const fit=Math.min(gridSize/impImg.naturalWidth, gridHeight/impImg.naturalHeight);
        impScale=fit; impTx=(gridSize-impImg.naturalWidth*fit)/2; impTy=(gridHeight-impImg.naturalHeight*fit)/2;

    }
    function impSample(gray,x,y){ if(x<0||x>=gridSize||y<0||y>=gridHeight) return 0; return gray[y*gridSize+x]; }
    function importApply(){
        if(!impImg) return;
        const oc=document.createElement('canvas'); oc.width=gridSize; oc.height=gridHeight;
        const octx=oc.getContext('2d');
        octx.imageSmoothingEnabled=true;
        octx.drawImage(impImg, impTx, impTy, impImg.naturalWidth*impScale, impImg.naturalHeight*impScale);
        const d=octx.getImageData(0,0,gridSize,gridHeight).data;
        const n=gridSize*gridHeight, gray=new Float32Array(n), alpha=new Uint8Array(n);
        for(let i=0;i<n;i++){
            alpha[i]=d[i*4+3];
            gray[i]= alpha[i]>16 ? (d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114) : 255;  // 空白按白计
        }
        saveState();
        const pd=getCurrentFrame().pixelData;
        if(impMode==='fill'){
            for(let i=0;i<n;i++){ const y=Math.floor(i/gridSize),x=i%gridSize; pd[y][x]=(alpha[i]>16&&gray[i]<impThresh)?BLACK:WHITE; }
        } else if(impMode==='adaptive'){
            // 自适应阈值(局部均值 - C)：内部有明暗/深浅变化时按局部对比度区分成黑白
            const bs=Math.max(3, Math.round(Math.min(gridSize,gridHeight)/6)|1), half=(bs-1)>>1;
            const W2=gridSize+1, H2=gridHeight+1, integ=new Float64Array(W2*H2);
            for(let y=0;y<gridHeight;y++){
                let row=0;
                for(let x=0;x<gridSize;x++){ row+=gray[y*gridSize+x]; integ[(y+1)*W2+(x+1)]=integ[y*W2+(x+1)]+row; }
            }
            for(let y=0;y<gridHeight;y++) for(let x=0;x<gridSize;x++){
                const i=y*gridSize+x;
                if(alpha[i]<=16){ pd[y][x]=WHITE; continue; }
                const x0=Math.max(0,x-half),x1=Math.min(gridSize-1,x+half),y0=Math.max(0,y-half),y1=Math.min(gridHeight-1,y+half);
                const area=(x1-x0+1)*(y1-y0+1);
                const sum=integ[(y1+1)*W2+(x1+1)]-integ[y0*W2+(x1+1)]-integ[(y1+1)*W2+x0]+integ[y0*W2+x0];
                pd[y][x]=(gray[i] < sum/area - impThresh)?BLACK:WHITE;
            }
        } else {
            for(let y=0;y<gridHeight;y++) for(let x=0;x<gridSize;x++){
                const i=y*gridSize+x;
                if(alpha[i]<=16){ pd[y][x]=WHITE; continue; }
                const gx=impSample(gray,x-1,y+1)+2*impSample(gray,x,y+1)+impSample(gray,x+1,y+1)
                        -impSample(gray,x-1,y-1)-2*impSample(gray,x,y-1)-impSample(gray,x+1,y-1);
                const gy=impSample(gray,x+1,y-1)+2*impSample(gray,x+1,y)+impSample(gray,x+1,y+1)
                        -impSample(gray,x-1,y-1)-2*impSample(gray,x-1,y)-impSample(gray,x-1,y+1);
                pd[y][x]=(Math.sqrt(gx*gx+gy*gy)>impThresh)?BLACK:WHITE;
            }
        }
        importCancel(); renderAll(); showToast('已写入当前帧');
    }
    function importCancel(){
        importing=false; impImg=null; impPan=false; impPanStart=null;
        importBar.style.display='none'; renderCurrentFrame();
    }

    impThreshSlider.oninput=function(){ impThresh=parseInt(this.value); impThreshVal.textContent=impThresh; };

    document.getElementById('btnRefImage').onclick=()=> document.getElementById('refFileInput').click();
    document.getElementById('refFileInput').onchange = function(e){
        const file=e.target.files[0]; if(!file) return; const reader=new FileReader();
        reader.onload=ev=>{ refBgImg.src=ev.target.result; refBgImg.style.display='block'; refControls.style.display='flex'; refOpacity=0.4; refOpacityInput.value=0.4; refOpacityLabel.textContent='40%'; refBgImg.style.opacity=refOpacity; renderCurrentFrame(); showToast('参考图已设置'); };
        reader.readAsDataURL(file); this.value='';
    };
    refOpacityInput.oninput = function(){ refOpacity=parseFloat(this.value); refOpacityLabel.textContent=Math.round(refOpacity*100)+'%'; refBgImg.style.opacity=refOpacity; };
    document.getElementById('btnClearRef').onclick=()=>{ refBgImg.src=''; refBgImg.style.display='none'; refControls.style.display='none'; showToast('参考图已清除'); };

    function undo(){ const hist=getCurrentHistory(); if(!hist.undoStack.length) return; hist.redoStack.push(getCurrentFrame().pixelData.map(r=>[...r])); getCurrentFrame().pixelData=hist.undoStack.pop(); renderAll(); }
    function redo(){ const hist=getCurrentHistory(); if(!hist.redoStack.length) return; hist.undoStack.push(getCurrentFrame().pixelData.map(r=>[...r])); getCurrentFrame().pixelData=hist.redoStack.pop(); renderAll(); }
    document.getElementById('btnUndo').onclick=undo;
    document.getElementById('btnRedo').onclick=redo;
    document.getElementById('btnClearFrame').onclick=()=>{ if(confirm('清空当前帧？')){ saveState(); getCurrentFrame().pixelData=Array.from({length:gridSize},()=>new Array(gridSize).fill(WHITE)); renderAll(); } };
    document.getElementById('btnInvert').onclick=()=>{ saveState(); const pd=getCurrentFrame().pixelData; for(let y=0;y<gridSize;y++) for(let x=0;x<gridSize;x++){ let c=pd[y][x]; let r=255-((c>>16)&0xFF),g=255-((c>>8)&0xFF),b=255-(c&0xFF); pd[y][x]=applyBwFilter((r<<16)|(g<<8)|b); } renderAll(); };
    document.getElementById('btnGrid').onclick=()=>{ showGrid=!showGrid; renderCurrentFrame(); };

    document.getElementById('btnAddFrame').onclick=()=>{ frames.push({pixelData:Array.from({length:gridSize},()=>new Array(gridSize).fill(WHITE))}); historyStacks.push({undoStack:[],redoStack:[]}); currentFrameIdx=frames.length-1; renderAll(); };
    document.getElementById('btnDupFrame').onclick=()=>{ const copy=getCurrentFrame().pixelData.map(r=>[...r]); frames.splice(currentFrameIdx+1,0,{pixelData:copy}); historyStacks.splice(currentFrameIdx+1,0,{undoStack:[],redoStack:[]}); currentFrameIdx++; renderAll(); };
    document.getElementById('btnDelFrame').onclick=()=>{ if(frames.length<=1) return showToast('至少保留一帧'); frames.splice(currentFrameIdx,1); historyStacks.splice(currentFrameIdx,1); if(currentFrameIdx>=frames.length) currentFrameIdx=frames.length-1; renderAll(); };
    document.getElementById('btnMoveUp').onclick=()=>{ if(currentFrameIdx<=0) return; [frames[currentFrameIdx],frames[currentFrameIdx-1]]=[frames[currentFrameIdx-1],frames[currentFrameIdx]]; [historyStacks[currentFrameIdx],historyStacks[currentFrameIdx-1]]=[historyStacks[currentFrameIdx-1],historyStacks[currentFrameIdx]]; currentFrameIdx--; renderAll(); };
    document.getElementById('btnMoveDown').onclick=()=>{ if(currentFrameIdx>=frames.length-1) return; [frames[currentFrameIdx],frames[currentFrameIdx+1]]=[frames[currentFrameIdx+1],frames[currentFrameIdx]]; [historyStacks[currentFrameIdx],historyStacks[currentFrameIdx+1]]=[historyStacks[currentFrameIdx+1],historyStacks[currentFrameIdx]]; currentFrameIdx++; renderAll(); };

    document.getElementById('btnPlay').onclick=()=>{ if(playing){ clearInterval(playTimer); playTimer=null; playing=false; document.getElementById('btnPlay').textContent='▶ 播放'; } else { if(frames.length<=1) return showToast('至少2帧'); playing=true; document.getElementById('btnPlay').textContent='⏸ 暂停'; let idx=currentFrameIdx; playTimer=setInterval(()=>{ idx=(idx+1)%frames.length; if(idx===0&&!loop){ clearInterval(playTimer); playing=false; document.getElementById('btnPlay').textContent='▶ 播放'; idx=frames.length-1; } if(playing) switchFrame(idx); },1000/fps); } };
    document.getElementById('fpsSlider').oninput=function(){ fps=parseInt(this.value); document.getElementById('fpsLabel').textContent=fps; if(playing){ clearInterval(playTimer); document.getElementById('btnPlay').click(); } };
    document.getElementById('loopCheck').onchange=function(){ loop=this.checked; };
    sizeSelect.onchange=()=>{
        const v=sizeSelect.value, m=v.match(/^(\d+)x(\d+)$/);
        if(m) resizeAllFrames(parseInt(m[1]),parseInt(m[2]));
        else resizeAllFrames(parseInt(v),parseInt(v));
    };

    function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500); }

    // ===================== AIMonitor 设备控制（Web Serial） =====================
    const $id=el=>document.getElementById(el);
    const logArea=$id('logArea'), connDot=$id('connDot'), connBtn=$id('btnConnect');
    const baudSelect=$id('baudSelect'), serialPorts=$id('serialPorts'), animName=$id('animName');
    const streamBtn=$id('btnStreamToggle');
    let port=null, reader=null, writer=null, devConnected=false, devStreaming=false;
    let lineBuf='', devDecoder=new TextDecoder();
    let pending=[];
    let streamTimer=null, streamSeq=0, streamBusy=false, lastProgLog=0;

    function logLine(text, cls){
        const d=document.createElement('div'); d.className='log-line '+(cls||''); d.textContent=text;
        logArea.appendChild(d); logArea.scrollTop=logArea.scrollHeight;
        while(logArea.childNodes.length>80) logArea.removeChild(logArea.firstChild);
    }
    function updateDevUI(){
        connBtn.textContent = devConnected ? '🔌 断开' : '🔌 连接';
        connDot.className = 'conn-dot' + (devStreaming ? ' streaming' : (devConnected ? ' on' : ''));
        streamBtn.classList.toggle('on', devStreaming);
        streamBtn.textContent = devStreaming ? '⏹ 流式预览' : '🔴 流式预览';
    }
    function crc32(buf){
        let crc=0xFFFFFFFF;
        for(let i=0;i<buf.length;i++){
            let c=(crc^buf[i])&0xFF;
            for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
            crc=(crc>>>8)^c;
        }
        return (crc^0xFFFFFFFF)>>>0;
    }
    // 帧数据(画布 gridSize×gridHeight) -> 设备 128x64 XBM(1024B)，等比缩放并居中
    // 设备显示为 LSB 位序：字节 bit0 = 最左像素
    function frameToDeviceBytes(pd){
        const W=128,H=64,out=new Uint8Array(W*H/8);
        const scale=Math.min(W/gridSize,H/gridHeight);
        const dw=Math.max(1,Math.round(gridSize*scale)), dh=Math.max(1,Math.round(gridHeight*scale));
        const ox=Math.floor((W-dw)/2), oy=Math.floor((H-dh)/2);
        for(let y=0;y<H;y++) for(let x=0;x<W;x++){
            const sx=Math.floor((x-ox)/scale), sy=Math.floor((y-oy)/scale);
            if(sx>=0&&sx<gridSize&&sy>=0&&sy<gridHeight&&pd[sy][sx]!==WHITE) out[(y*W+x)>>3]|=1<<(x&7);
        }
        return out;
    }
    // 构造 .anm：ANM0 头 + fps + 帧数(LE) + 保留 + 每帧1024B
    function buildAnm(fpsv){
        const n=frames.length, size=8+n*1024, out=new Uint8Array(size);
        out[0]=0x41; out[1]=0x4E; out[2]=0x4D; out[3]=0x30;
        out[4]=fpsv&0xFF; out[5]=n&0xFF; out[6]=(n>>8)&0xFF; out[7]=0;
        let off=8;
        for(const f of frames){ out.set(frameToDeviceBytes(f.pixelData), off); off+=1024; }
        return out;
    }
    function encodePacket(obj, payload){
        const head=new TextEncoder().encode(JSON.stringify(obj)+'\n');
        if(!payload) return head;
        const out=new Uint8Array(head.length+payload.length); out.set(head,0); out.set(payload,head.length); return out;
    }
    function request(obj, payload, expects, timeoutMs){
        expects=expects||['ack']; timeoutMs=timeoutMs||4000;
        return new Promise((resolve,reject)=>{
            const p={resolve,reject,expects};
            p.t=setTimeout(()=>{ const i=pending.indexOf(p); if(i>=0)pending.splice(i,1); reject(new Error('超时: '+obj.cmd)); },timeoutMs);
            pending.push(p);
            (async()=>{ try{ await writer.write(encodePacket(obj,payload)); }catch(e){ const i=pending.indexOf(p); if(i>=0)pending.splice(i,1); clearTimeout(p.t); reject(e); } })();
        });
    }
    function nackText(code){ return {1:'未知命令',2:'参数错误',3:'文件不存在',4:'CRC校验失败',5:'存储已满'}[code]||'未知错误码'; }
    function handleLine(line){
        let obj; try{ obj=JSON.parse(line); }catch(e){ logLine('< '+line,'raw'); return; }
        const resp=obj.resp;
        if(resp==='progress'){ if(Date.now()-lastProgLog>1000){ logLine('< progress seq='+obj.seq,'rx'); lastProgLog=Date.now(); } return; }
        // nack 按顺序属于最近发送的命令（同一时刻仅一个在途请求）；其余按 expects 匹配
        const pi = (resp==='nack') ? (pending.length?0:-1) : pending.findIndex(p=>p.expects.includes(resp));
        if(pi>=0 && pending[pi]){ const p=pending.splice(pi,1)[0]; clearTimeout(p.t);
            logLine('< '+line, resp==='nack'?'err':'rx');
            if(resp==='nack') p.reject(new Error('设备错误码 '+obj.code+' ('+nackText(obj.code)+')')); else p.resolve(obj);
        } else logLine('< '+line,'rx');
    }
    async function readLoop(){
        try{
            while(port&&reader){
                const {value,done}=await reader.read();
                if(done) break;
                if(value){ lineBuf+=devDecoder.decode(value,{stream:true});
                    let idx;
                    while((idx=lineBuf.indexOf('\n'))>=0){ const l=lineBuf.slice(0,idx).trim(); lineBuf=lineBuf.slice(idx+1); if(l) handleLine(l); }
                }
            }
        }catch(e){ if(devConnected) logLine('读取错误: '+e.message,'err'); }
        if(devConnected){ devConnected=false; devStreaming=false; if(streamTimer){clearInterval(streamTimer);streamTimer=null;} updateDevUI(); logLine('串口已断开','warn'); }
    }
    async function openPort(p){
        await p.open({baudRate:parseInt(baudSelect.value)});
        port=p; reader=port.readable.getReader(); writer=port.writable.getWriter();
        devConnected=true; lineBuf=''; devDecoder=new TextDecoder();
        updateDevUI(); logLine('已连接 @'+baudSelect.value,'ok'); readLoop();
    }
    connBtn.onclick=async()=>{
        if(devConnected){ stopStream(); await disconnectSerial(); return; }
        try{
            if(!('serial' in navigator)){ logLine('此浏览器不支持 Web Serial，请用 Chrome/Edge 在 localhost 下打开','err'); return; }
            const sel=serialPorts.value;
            if(sel && serialPorts.selectedOptions[0].__port){ await openPort(serialPorts.selectedOptions[0].__port); }
            else{ const p=await navigator.serial.requestPort(); await openPort(p); updatePortList(); }
        }catch(e){ if(e&&e.name==='NotFoundError') logLine('未选择端口','warn'); else logLine('连接失败: '+(e&&e.message||e),'err'); }
    };
    async function disconnectSerial(){
        try{
            if(reader){ try{ await reader.cancel(); }catch(e){} reader=null; }
            if(writer){ try{ writer.releaseLock(); }catch(e){} writer=null; }
            if(port){ try{ await port.close(); }catch(e){} port=null; }
        }catch(e){}
        devConnected=false; updateDevUI(); logLine('已断开','warn');
    }
    async function updatePortList(){
        serialPorts.innerHTML='';
        if(!('serial' in navigator)){ const o=document.createElement('option'); o.textContent='不支持 Web Serial'; serialPorts.appendChild(o); return; }
        try{
            const ports=await navigator.serial.getPorts();
            if(ports.length===0){ const o=document.createElement('option'); o.textContent='选择端口…'; serialPorts.appendChild(o); return; }
            for(const p of ports){
                const info=p.getInfo();
                const o=document.createElement('option');
                o.textContent=(info.usbVendorId?('USB 0x'+(info.usbVendorId.toString(16).padStart(4,'0'))+':'+(info.usbProductId.toString(16).padStart(4,'0'))):'串口');
                o.__port=p; serialPorts.appendChild(o);
            }
        }catch(e){ const o=document.createElement('option'); o.textContent='读取端口失败'; serialPorts.appendChild(o); }
    }
    async function requireDev(){ if(!devConnected){ logLine('请先连接设备','warn'); return false; } return true; }
    $id('btnUpload').onclick=async()=>{
        if(!(await requireDev())) return;
        if(devStreaming) stopStream();
        const name=(animName.value||'editor.anm').trim(), fpsv=fps;
        let data;
        try{ data=buildAnm(fpsv); }
        catch(e){ logLine('构造 .anm 失败: '+e.message,'err'); showToast('上传失败'); return; }
        for(let attempt=1; attempt<=2; attempt++){
            if(attempt>1) logLine('>> 第 '+attempt+' 次尝试…','warn');
            try{
                logLine('>> ping 握手（确认设备就绪）…');
                await request({cmd:'ping'},null,['pong'],5000);
                logLine('>> up_begin '+name+' size='+data.length);
                const ready=await request({cmd:'up_begin',name,size:data.length},null,['ready'],6000);
                let off=ready.off||0;
                if(off>0) logLine('>> 检测到已有 '+off+'B，断点续传','warn');
                let lastLog=0;
                while(off<data.length){
                    const piece=data.slice(off,Math.min(off+2048,data.length));
                    await request({cmd:'up_chunk',off,size:piece.length},piece,['ack'],10000);
                    off+=piece.length;
                    if(off-lastLog>=16384){ logLine('   已上传 '+off+'/'+data.length+'B'); lastLog=off; }
                }
                const crc=crc32(data);
                logLine('>> up_end crc='+crc);
                await request({cmd:'up_end',crc},null,['done'],20000);
                logLine('上传完成 ✓ '+name+'（'+frames.length+'帧 @'+fpsv+'fps）','ok');
                showToast('动画已上传 '+name);
                return;
            }catch(e){
                logLine('第 '+attempt+' 次上传失败: '+e.message,'err');
                if(attempt===2){
                    if(/错误码 4/.test(e.message)) logLine('提示: CRC失败，可再次上传','warn');
                    if(/错误码 5/.test(e.message)) logLine('提示: 存储不足，先 🗑 删除旧动画或查看 🔄 状态 空间','warn');
                    if(/错误码 2|超时/.test(e.message)) logLine('提示: 多为高速丢字节，设备已自动复位，直接再点上传即可','warn');
                    showToast('上传失败');
                }
            }
        }
    };
    $id('btnSendFrame').onclick=async()=>{
        if(!(await requireDev())) return;
        const d=frameToDeviceBytes(getCurrentFrame().pixelData);
        try{ await request({cmd:'show',seq:currentFrameIdx,size:1024},d,['ack'],5000); logLine('已发送当前帧 #'+currentFrameIdx,'ok'); }
        catch(e){ logLine('发送失败: '+e.message,'err'); }
    };
    $id('btnDevicePlay').onclick=async()=>{
        if(!(await requireDev())) return;
        if(devStreaming) stopStream();
        const name=(animName.value||'editor.anm').trim();
        try{ await request({cmd:'play',name,fps:0,loop:1},null,['state','ack'],5000); logLine('▶ 设备播放 '+name,'ok'); }
        catch(e){ logLine(e.message,'err'); }
    };
    $id('btnDeviceStop').onclick=async()=>{
        if(!(await requireDev())) return;
        try{ await request({cmd:'stop'},null,['state','ack'],5000); logLine('⏹ 已停止','warn'); }
        catch(e){ logLine(e.message,'err'); }
    };
    $id('btnRefresh').onclick=async()=>{
        if(!(await requireDev())) return;
        try{
            const p=await request({cmd:'ping'},null,['pong'],5000);
            const s=await request({cmd:'status'},null,['state'],5000);
            let lst='';
            try{ const l=await request({cmd:'list'},null,['list'],5000); lst='  动画: '+(l.anims&&l.anims.length?l.anims.join(', '):'(空)'); }catch(e){}
            logLine(`固件 ${p.fw} proto ${p.proto} 可用 ${p.fs_free}/${p.fs_total}B | 状态 ${s.state} ${s.name||''}${lst}`,'ok');
        }catch(e){ logLine(e.message,'err'); }
    };
    $id('btnDelete').onclick=async()=>{
        if(!(await requireDev())) return;
        const name=(animName.value||'editor.anm').trim();
        if(!confirm('删除设备中的 '+name+' ？')) return;
        try{ await request({cmd:'delete',name},null,['ack'],5000); logLine('已删除 '+name,'ok'); showToast('已删除 '+name); }
        catch(e){ logLine('删除失败: '+e.message,'err'); }
    };
    streamBtn.onclick=async()=>{
        if(!(await requireDev())) return;
        if(devStreaming){ stopStream(); return; }
        if(frames.length<2) return logLine('至少 2 帧才能流式预览','warn');
        try{
            if(streamTimer){ clearInterval(streamTimer); streamTimer=null; }
            streamBusy=false;
            // 先 stop 复位设备到空闲，同时作为握手确认链路通畅
            logLine('>> stop 复位…');
            await request({cmd:'stop'},null,['state','ack'],6000);
            devStreaming=true; streamSeq=0; updateDevUI();
            await request({cmd:'stream_start',fps,loop:1},null,['state','ready'],10000);
            logLine('▶ 流式预览 '+fps+'fps','ok');
            streamTimer=setInterval(()=>{ sendStreamFrame(); }, 1000/fps);
        }catch(e){ devStreaming=false; updateDevUI(); logLine(e.message,'err'); }
    };
    function stopStream(){
        devStreaming=false;
        if(streamTimer){ clearInterval(streamTimer); streamTimer=null; }
        updateDevUI();
        if(devConnected) request({cmd:'stream_end'},null,['done','ack'],3000).catch(()=>{});
        logLine('⏹ 流式预览结束','warn');
    }
    async function sendStreamFrame(){
        if(!devStreaming || streamBusy) return;   // 上一帧未完成则跳过，避免堆积
        streamBusy=true;
        const f=frames[streamSeq%frames.length];
        const d=frameToDeviceBytes(f.pixelData);
        try{ await request({cmd:'frame',seq:streamSeq,size:1024},d,['ack'],5000); streamSeq++; }
        catch(e){ stopStream(); }
        finally{ streamBusy=false; }
    }
    function initDevice(){ updatePortList(); updateDevUI(); }
    window.addEventListener('beforeunload',()=>{ if(devStreaming) stopStream(); });

    initFrames(); updateZoom(); updateBitOrderUI();
    document.querySelector('.color-swatch[data-color="#000000"]').classList.add('active');
    renderAll(); initDevice(); showToast('🎨 编辑器就绪 (黑白/LSB)');
})();
</script>
</body>
</html>
