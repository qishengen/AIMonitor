<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素动画编辑器 · 修复版</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #2a2a3c;
            --surface2: #33334a;
            --text: #e0e0e0;
            --text-secondary: #b0b0c0;
            --accent: #7c8cf8;
            --accent-hover: #9aabff;
            --border: #44445a;
            --radius: 10px;
            --radius-sm: 6px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background:var(--bg); color:var(--text);
            min-height:100vh; display:flex; justify-content:center; align-items:center;
            padding:20px; user-select:none; -webkit-user-select:none;
        }
        .app{
            background:var(--surface); border-radius:16px; padding:18px 16px 12px;
            box-shadow:0 4px 20px rgba(0,0,0,0.4); width:100%; max-width:900px;
            display:flex; flex-direction:column; gap:10px;
        }
        .header{
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;
        }
        .title{ font-size:1.4rem; font-weight:700; display:flex; align-items:center; gap:6px; color:#fff; }
        .size-selector{
            display:flex; align-items:center; gap:8px; background:var(--surface2);
            padding:6px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
        }
        .size-selector select{
            background:var(--surface); color:#fff; border:1px solid var(--border);
            border-radius:4px; padding:5px 10px; font-size:0.85rem; cursor:pointer;
        }
        .toolbar-row{
            display:flex; flex-wrap:wrap; gap:8px; align-items:center;
        }
        .toolbar-group{
            display:flex; align-items:center; gap:6px; background:var(--surface2);
            padding:7px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
        }
        .brush-group {
            flex: 1 1 auto;
            justify-content: space-between;
        }
        .color-swatch{
            width:28px; height:28px; border-radius:50%; cursor:pointer;
            border:2px solid transparent; transition:0.15s; flex-shrink:0;
        }
        .color-swatch:hover{ border-color:#fff; transform:scale(1.15); z-index:2; }
        .color-swatch.active{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.35); transform:scale(1.08); }
        .color-swatch.eraser{ background:#fff!important; display:flex; align-items:center; justify-content:center; font-size:0.75rem; }
        .color-swatch.eraser::after{ content:'🧹'; }
        input[type="color"]{ width:34px; height:28px; border:2px solid var(--border); border-radius:4px; cursor:pointer; background:transparent; }
        .btn{
            padding:6px 12px; border:1px solid var(--border); background:var(--surface);
            color:#eee; border-radius:var(--radius-sm); cursor:pointer; font-size:0.8rem;
            font-weight:500; transition:0.15s; white-space:nowrap; display:flex; align-items:center; gap:4px;
        }
        .btn:hover{ background:var(--accent); border-color:var(--accent); color:#fff; transform:translateY(-1px); }
        .btn.accent{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
        .btn.accent:hover{ background:var(--accent-hover); }
        .btn-sm{
            padding:4px 8px; font-size:0.7rem; border-radius:3px; border:1px solid var(--border);
            background:var(--surface); color:#ddd; cursor:pointer; transition:0.15s;
        }
        .btn-sm:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }
        .btn-sm.danger{ color:#f87171; border-color:#f87171; }
        .btn-sm.danger:hover{ background:#f87171; color:#fff; }
        .canvas-outer{ display:flex; flex-direction:column; align-items:center; gap:6px; }
        .canvas-scroll{
            overflow:auto; max-height:70vh; border-radius:var(--radius);
            box-shadow:0 0 0 3px var(--border),0 6px 24px rgba(0,0,0,0.5);
            background:#fff; position:relative;
        }
        .canvas-inner{
            position:relative; width:512px; height:512px;
            transform-origin:top left; transition:transform 0.1s;
        }
        .canvas-inner img.ref-bg{
            position:absolute; top:0; left:0; width:100%; height:100%;
            object-fit:fill; pointer-events:none; opacity:0.3;
            image-rendering:pixelated; z-index:0;
        }
        canvas#pixelCanvas{
            display:block; width:100%; height:100%;
            image-rendering:crisp-edges; image-rendering:pixelated;
            position:relative; z-index:1;
        }
        .zoom-bar{
            display:flex; align-items:center; gap:6px; font-size:0.8rem;
            background:var(--surface2); padding:4px 10px; border-radius:4px;
            border:1px solid var(--border);
        }
        .zoom-bar input[type="range"]{ width:80px; accent-color:var(--accent); }
        .ref-controls{
            display:flex; align-items:center; gap:6px; font-size:0.75rem;
            background:var(--surface2); padding:4px 10px; border-radius:4px;
            border:1px solid var(--border);
        }
        .frame-toolbar-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }
        .frames-row{
            display:flex; align-items:center; gap:6px;
            background:var(--surface2); border-radius:var(--radius-sm);
            border:1px solid var(--border); padding:6px 8px;
            width:100%; max-width:520px; height:66px; overflow:hidden;
            margin: 0 auto;
        }
        .frame-list{
            display:flex; gap:4px; overflow-x:auto; flex:1; height:100%;
            align-items:center; padding:2px 0;
        }
        .frame-item{
            width:56px; height:56px; border:2px solid transparent; border-radius:4px;
            cursor:pointer; flex-shrink:0; background:#fff; transition:0.12s;
            display:flex; align-items:center; justify-content:center; overflow:hidden;
        }
        .frame-item.active{ border-color:var(--accent)!important; box-shadow:0 0 8px rgba(124,140,248,0.5); }
        .frame-item canvas{ width:100%; height:100%; image-rendering:pixelated; display:block; }
        .playback-bar{
            display:flex; align-items:center; gap:10px; padding:6px 12px;
            background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);
            flex-wrap:wrap; justify-content:center; max-width:520px; width:100%; margin:0 auto;
        }
        .playback-bar button{
            background:var(--accent); border:none; color:#fff; border-radius:4px;
            padding:5px 12px; cursor:pointer; font-weight:600; font-size:0.8rem;
        }
        .playback-bar input[type="range"]{ width:70px; accent-color:var(--accent); }
        .status-bar{
            display:flex; flex-wrap:wrap; gap:10px; font-size:0.73rem;
            color:var(--text-secondary); justify-content:center; padding:2px 0;
        }
        .status-item{
            background:var(--surface2); padding:3px 10px; border-radius:4px;
            border:1px solid var(--border); white-space:nowrap;
        }
        .toast{
            position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-120px);
            background:#444; color:#fff; padding:9px 22px; border-radius:22px;
            font-weight:600; z-index:999; pointer-events:none; transition:0.3s;
        }
        .toast.show{ transform:translateX(-50%) translateY(0); }
        .hint{ font-size:0.7rem; color:#666; text-align:center; }
        @media(max-width:700px){
            .app{padding:10px;}
            .btn{padding:5px 8px; font-size:0.7rem;}
            .frame-item{width:38px; height:38px;}
            .frames-row{height:50px;}
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="title">🎨 像素动画编辑器</div>
        <div class="size-selector">
            <label>画布尺寸:</label>
            <select id="sizeSelect">
                <option value="16">16×16</option>
                <option value="32">32×32</option>
                <option value="64" selected>64×64</option>
                <option value="128">128×128</option>
                <option value="256">256×256</option>
            </select>
        </div>
    </div>

    <div class="toolbar-row">
        <div class="toolbar-group">
            <span>📥 导入</span>
            <button class="btn btn-sm" id="btnImportImage">🖼 图片→帧</button>
            <button class="btn btn-sm" id="btnImportCArray">📄 C数组</button>
            <button class="btn btn-sm" id="btnRefImage">📷 参考图</button>
            <input type="file" id="fileInput" accept="image/*,.txt,.h,.c" style="display:none">
            <input type="file" id="refFileInput" accept="image/*" style="display:none">
        </div>
    </div>

    <div class="toolbar-row">
        <div class="toolbar-group brush-group">
            <span>🎨 画笔</span>
            <div class="color-presets" id="colorPresets" style="display:flex; gap:6px; align-items:center;">
                <span class="color-swatch active" data-color="#000000" style="background:#000" title="黑色"></span>
                <span class="color-swatch" data-color="#e53935" style="background:#e53935" title="红色"></span>
                <span class="color-swatch" data-color="#2e7d32" style="background:#2e7d32" title="绿色"></span>
                <span class="color-swatch" data-color="#1e56d0" style="background:#1e56d0" title="蓝色"></span>
                <span class="color-swatch" data-color="#ef6c00" style="background:#ef6c00" title="橙色"></span>
                <span class="color-swatch" data-color="#f9c851" style="background:#f9c851" title="黄色"></span>
                <span class="color-swatch" data-color="#7b1fa2" style="background:#7b1fa2" title="紫色"></span>
                <span class="color-swatch eraser" data-color="#FFFFFF" title="橡皮擦（白色）"></span>
            </div>
            <input type="color" id="customColor" value="#000000" title="自定义颜色">
        </div>
    </div>

    <div class="toolbar-row">
        <div class="toolbar-group">
            <button class="btn" id="btnUndo">↩ 撤销</button>
            <button class="btn" id="btnRedo">↪ 重做</button>
            <button class="btn" id="btnClearFrame">🗑 清空帧</button>
            <button class="btn" id="btnInvert">🔲 反色</button>
            <button class="btn" id="btnGrid">📐 网格</button>
        </div>
        <div class="toolbar-group">
            <button class="btn" id="btnMode">🎨 彩色模式</button>
        </div>
    </div>

    <div class="canvas-outer">
        <div class="zoom-bar">
            <span>🔍 缩放:</span>
            <input type="range" id="zoomSlider" min="1" max="5" value="1" step="0.25">
            <span id="zoomLabel">1x</span>
            <button class="btn-sm" id="zoomReset">1:1</button>
        </div>
        <div class="canvas-scroll" id="canvasScroll">
            <div class="canvas-inner" id="canvasInner">
                <img class="ref-bg" id="refBgImg" src="" style="display:none;">
                <canvas id="pixelCanvas"></canvas>
            </div>
        </div>
        <div class="ref-controls" id="refControls" style="display:none;">
            <span>📷 参考图透明度:</span>
            <input type="range" id="refOpacity" min="0" max="1" value="0.3" step="0.05">
            <span id="refOpacityLabel">30%</span>
            <button class="btn-sm" id="btnClearRef">清除</button>
        </div>
    </div>

    <div class="frame-toolbar-row">
        <button class="btn-sm" id="btnAddFrame">➕ 添加</button>
        <button class="btn-sm" id="btnDupFrame">📋 复制</button>
        <button class="btn-sm danger" id="btnDelFrame">🗑 删除</button>
        <button class="btn-sm" id="btnMoveUp">⬆ 上移</button>
        <button class="btn-sm" id="btnMoveDown">⬇ 下移</button>
    </div>

    <div class="frames-row">
        <div class="frame-list" id="frameList"></div>
    </div>

    <div class="playback-bar">
        <button id="btnPlay">▶ 播放</button>
        <span>FPS:</span>
        <input type="range" id="fpsSlider" min="1" max="30" value="12">
        <span id="fpsLabel">12</span>
        <label><input type="checkbox" id="loopCheck" checked> 循环</label>
    </div>

    <div class="toolbar-row" style="justify-content:center;">
        <div class="toolbar-group">
            <span>📤 导出</span>
            <button class="btn btn-sm" id="btnExportPNG">PNG</button>
            <button class="btn btn-sm" id="btnExportJPEG">JPEG</button>
            <button class="btn btn-sm" id="btnExportBMP">BMP</button>
            <button class="btn btn-sm accent" id="btnExportGIF">GIF动画</button>
            <button class="btn btn-sm" id="btnExportCArr">C数组(帧)</button>
            <button class="btn btn-sm" id="btnExportCArrAll">C数组(全部)</button>
            <button class="btn btn-sm" id="btnBitOrder" title="切换黑白位图的位序">位序: MSB</button>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-item" id="statusCoords">坐标: — , —</span>
        <span class="status-item" id="statusPixels">已绘制: 0 px</span>
        <span class="status-item" id="statusFrame">帧: 1/1</span>
        <span class="status-item" id="statusMode">彩色</span>
        <span class="status-item" id="statusBitOrder">位序: MSB</span>
    </div>

    <div class="hint">
        🖱 <kbd>左键</kbd>绘制 <kbd>右键</kbd>擦除 · <kbd>Ctrl+Z</kbd>撤销 <kbd>Ctrl+Y</kbd>重做 · 滚轮缩放画布
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
class GIFDecoder {
    constructor(data) { this.data = new Uint8Array(data); this.pos = 0; this.frames = []; this.width = 0; this.height = 0; this.globalColorTable = null; }
    readByte(){ return this.data[this.pos++]; }
    readShort(){ return this.data[this.pos++] | (this.data[this.pos++] << 8); }
    readString(len){ let s=''; for(let i=0;i<len;i++) s+=String.fromCharCode(this.data[this.pos++]); return s; }
    readSubBlocks(){ let blocks=[],size; while((size=this.readByte())>0){ blocks.push(this.data.slice(this.pos,this.pos+size)); this.pos+=size; } return blocks; }
    lzwDecode(minCodeSize, data){
        let clearCode = 1 << minCodeSize, eoiCode = clearCode+1, codeSize = minCodeSize+1, dict = new Map();
        for(let i=0;i<clearCode;i++) dict.set(i,[i]); dict.set(clearCode,['clear']); dict.set(eoiCode,['eoi']);
        let result=[], bits=0, bitCount=0, idx=0, prev;
        const readBits = n => { while(bitCount<n){ bits|=data[idx++]<<bitCount; bitCount+=8; } let val=bits&((1<<n)-1); bits>>=n; bitCount-=n; return val; };
        while(true){
            let code = readBits(codeSize); if(code===eoiCode) break;
            if(code===clearCode){ codeSize=minCodeSize+1; dict=new Map(); for(let i=0;i<clearCode;i++) dict.set(i,[i]); dict.set(clearCode,['clear']); dict.set(eoiCode,['eoi']); prev=undefined; continue; }
            let entry; if(dict.has(code)) entry=dict.get(code); else if(prev!==undefined) entry=[...prev,prev[0]]; else break;
            result.push(...entry); if(prev!==undefined && dict.size<4095) dict.set(dict.size,[...prev,entry[0]]);
            prev=entry; if(dict.size>=(1<<codeSize) && codeSize<12) codeSize++;
        } return result;
    }
    decode(){
        if(this.readString(3)!=='GIF') throw 'Not GIF'; this.readString(3);
        this.width=this.readShort(); this.height=this.readShort(); let packed=this.readByte(); this.readByte(); this.readByte();
        if(packed&0x80){ let size=2<<(packed&0x7); this.globalColorTable=this.data.slice(this.pos,this.pos+size*3); this.pos+=size*3; }
        let frames=[]; while(this.pos<this.data.length){
            let blockType=this.readByte();
            if(blockType===0x21){ let extType=this.readByte(); if(extType===0xF9){ this.readByte(); let p=this.readByte(); frames.push({delay:this.readShort()*10, transparent:p&1, transIndex:this.readByte()}); this.readByte(); } else { this.readByte(); this.readSubBlocks(); } }
            else if(blockType===0x2C){
                let imgLeft=this.readShort(),imgTop=this.readShort(),imgWidth=this.readShort(),imgHeight=this.readShort(),packed=this.readByte(),localTable=null;
                if(packed&0x80){ let size=2<<(packed&0x7); localTable=this.data.slice(this.pos,this.pos+size*3); this.pos+=size*3; }
                let minCodeSize=this.readByte(),blocks=this.readSubBlocks(),data=new Uint8Array(blocks.reduce((a,b)=>a+b.length,0)),off=0;
                blocks.forEach(b=>{data.set(b,off); off+=b.length;});
                let indices=this.lzwDecode(minCodeSize,data),frameObj=frames[frames.length]||{delay:100,transparent:0,transIndex:-1};
                frameObj.pixels=indices; frameObj.left=imgLeft; frameObj.top=imgTop; frameObj.width=imgWidth; frameObj.height=imgHeight; frameObj.localTable=localTable;
                frames.push(frameObj);
            } else if(blockType===0x3B) break;
        } this.frames=frames; return this;
    }
    getFrameImageData(frameIdx,scaleW,scaleH){
        let f=this.frames[frameIdx]; if(!f||!f.pixels) return null;
        let table=f.localTable||this.globalColorTable;
        let offCanvas=document.createElement('canvas'); offCanvas.width=this.width; offCanvas.height=this.height;
        let ctx=offCanvas.getContext('2d'),imgData=ctx.createImageData(this.width,this.height);
        for(let y=0;y<this.height;y++) for(let x=0;x<this.width;x++){
            let idx=y*this.width+x;
            if(x>=f.left&&x<f.left+f.width&&y>=f.top&&y<f.top+f.height){
                let pi=(y-f.top)*f.width+(x-f.left),colorIdx=f.pixels[pi];
                if(colorIdx!==undefined){
                    if(f.transparent&&colorIdx===f.transIndex){ imgData.data[idx*4+3]=0; }
                    else { let r=table[colorIdx*3]||0,g=table[colorIdx*3+1]||0,b=table[colorIdx*3+2]||0; imgData.data[idx*4]=r; imgData.data[idx*4+1]=g; imgData.data[idx*4+2]=b; imgData.data[idx*4+3]=255; }
                }
            } else { imgData.data[idx*4+3]=0; }
        } ctx.putImageData(imgData,0,0);
        let scaled=document.createElement('canvas'); scaled.width=scaleW; scaled.height=scaleH;
        let sctx=scaled.getContext('2d'); sctx.imageSmoothingEnabled=false;
        sctx.drawImage(offCanvas,0,0,scaleW,scaleH); return sctx.getImageData(0,0,scaleW,scaleH);
    }
}
class GIFEncoder {
    constructor(width,height){ this.width=width; this.height=height; this.frames=[]; this.globalPalette=null; this.loop=0; }
    addFrame(pixelData,delay){ this.frames.push({pixels:pixelData,delay:delay}); }
    quantize(){
        let colors=new Set(); for(let f of this.frames) for(let y=0;y<this.height;y++) for(let x=0;x<this.width;x++) colors.add(f.pixels[y][x]&0xFFFFFF);
        let palette=[...colors].slice(0,256); while(palette.length<256) palette.push(0xFFFFFF); this.globalPalette=palette; return palette;
    }
    build(){
        this.quantize(); let writer=new ByteWriter();
        writer.writeString('GIF89a'); writer.writeShort(this.width); writer.writeShort(this.height);
        writer.writeByte(0xF7); writer.writeByte(0); writer.writeByte(0);
        for(let i=0;i<256;i++){ let c=this.globalPalette[i]; writer.writeByte((c>>16)&0xFF); writer.writeByte((c>>8)&0xFF); writer.writeByte(c&0xFF); }
        writer.writeByte(0x21); writer.writeByte(0xFF); writer.writeByte(11); writer.writeString('NETSCAPE2.0'); writer.writeByte(3); writer.writeByte(1); writer.writeShort(this.loop); writer.writeByte(0);
        for(let f of this.frames){
            writer.writeByte(0x21); writer.writeByte(0xF9); writer.writeByte(4); writer.writeByte(0x00); writer.writeShort(Math.floor(f.delay/10)); writer.writeByte(0); writer.writeByte(0);
            writer.writeByte(0x2C); writer.writeShort(0); writer.writeShort(0); writer.writeShort(this.width); writer.writeShort(this.height); writer.writeByte(0);
            let indices=new Uint8Array(this.width*this.height);
            for(let y=0;y<this.height;y++) for(let x=0;x<this.width;x++){ let c=f.pixels[y][x]&0xFFFFFF; let idx=this.globalPalette.indexOf(c); indices[y*this.width+x]=idx>=0?idx:0; }
            let lzw=this.lzwEncode(indices,8); writer.writeByte(8); for(let block of lzw){ writer.writeByte(block.length); writer.writeBytes(block); } writer.writeByte(0);
        } writer.writeByte(0x3B); return writer.toBlob();
    }
    lzwEncode(data,minCodeSize){
        let clearCode=1<<minCodeSize,eoiCode=clearCode+1,codeSize=minCodeSize+1,dict=new Map(),output=[],bits=0,bitCount=0;
        for(let i=0;i<clearCode;i++) dict.set(String.fromCharCode(i),i);
        const writeBits=code=>{ bits|=code<<bitCount; bitCount+=codeSize; while(bitCount>=8){ output.push(bits&0xFF); bits>>=8; bitCount-=8; } };
        writeBits(clearCode); let w='';
        for(let i=0;i<data.length;i++){ let k=String.fromCharCode(data[i]),wk=w+k; if(dict.has(wk)) w=wk; else{ writeBits(dict.get(w)); dict.set(wk,dict.size); if(dict.size>=(1<<codeSize)&&codeSize<12) codeSize++; w=k; } }
        if(w!=='') writeBits(dict.get(w)); writeBits(eoiCode);
        if(bitCount>0) output.push(bits&0xFF);
        let blocks=[]; for(let i=0;i<output.length;i+=255) blocks.push(output.slice(i,Math.min(i+255,output.length))); return blocks.length?blocks:[new Uint8Array()];
    }
}
class ByteWriter{
    constructor(){ this.data=[]; }
    writeByte(b){ this.data.push(b&0xFF); }
    writeShort(s){ this.writeByte(s&0xFF); this.writeByte((s>>8)&0xFF); }
    writeString(s){ for(let i=0;i<s.length;i++) this.writeByte(s.charCodeAt(i)); }
    writeBytes(arr){ for(let b of arr) this.writeByte(b); }
    toBlob(){ return new Blob([new Uint8Array(this.data)],{type:'image/gif'}); }
}
</script>

<script>
(function(){
    const WHITE=0xFFFFFF, BLACK=0x000000, MAX_HISTORY=80;
    let gridSize=64, cellSize=512/gridSize;
    let frames=[],currentFrameIdx=0,historyStacks=[];
    let currentColor=BLACK, showGrid=true, hoverPos=null, isDrawing=false, drawMode='draw', lastCell=null;
    let playing=false, playTimer=null, fps=12, loop=true;
    let bwMode=false, zoomLevel=1, refOpacity=0.3;
    let msbFirst = true;

    const canvas=document.getElementById('pixelCanvas'), ctx=canvas.getContext('2d');
    const frameListDiv=document.getElementById('frameList'), toast=document.getElementById('toast');
    const sizeSelect=document.getElementById('sizeSelect'), fpsSlider=document.getElementById('fpsSlider'), fpsLabel=document.getElementById('fpsLabel'), loopCheck=document.getElementById('loopCheck');

    function getLine(r1,c1,r2,c2){
        const pts=[]; let dr=Math.abs(r2-r1),dc=Math.abs(c2-c1),sr=r1<r2?1:-1,sc=c1<c2?1:-1,err=dr-dc; let cr=r1,cc=c1;

    }

    function handleDraw(cell){

    function handleImageImport(e){

    // 修复版导入 C 数组：先提取宏，然后清理宏行再解析数据
    document.getElementById('btnImportCArray').onclick=()=>{
        const text = prompt('粘贴C数组 (支持二维/三维，彩色RGB值或黑白十六进制字节):');
        if (!text) return;

        // 从原始文本中提取宏定义
        const macroW = text.match(/#define\s+WIDTH\s+(\d+)/i);
        const macroH = text.match(/#define\s+HEIGHT\s+(\d+)/i);
        const macroF = text.match(/#define\s+FRAME_COUNT\s+(\d+)/i);
        const newW = macroW ? parseInt(macroW[1]) : null;
        const newH = macroH ? parseInt(macroH[1]) : null;
        const newF = macroF ? parseInt(macroF[1]) : null;

        // 根据宏调整画布尺寸和帧数
        if (newW && newH && (newW !== gridSize || newH !== gridSize)) {
            if (confirm(`C数组定义尺寸为 ${newW}×${newH}，当前画布为 ${gridSize}×${gridSize}。是否调整画布尺寸并导入数据？`)) {
                gridSize = newW;
                cellSize = 512 / gridSize;
                canvas.width = canvas.height = 512;
                initFrames();
                if (newF) {
                    while (frames.length < newF) {
                        frames.push({pixelData: Array.from({length: gridSize}, () => new Array(gridSize).fill(WHITE))});
                        historyStacks.push({undoStack: [], redoStack: []});
                    }
                }
                sizeSelect.value = gridSize;
            } else {
                showToast('导入取消');
                return;
            }
        }

        // 清理所有 #define 行，避免宏数字污染像素数据
        const cleanText = text.replace(/#define\s+.*/g, '');

        // 黑白十六进制字节导入
        if (bwMode && /0x[0-9a-fA-F]{2}/.test(cleanText)) {
            const hexMatches = cleanText.match(/0x[0-9a-fA-F]{2}/g);
            if (!hexMatches) return showToast('未检测到十六进制字节');
            const bytes = hexMatches.map(h => parseInt(h, 16));
            const totalBits = gridSize * gridSize;
            if (bytes.length * 8 < totalBits) return showToast('数据不足');
            const pd = Array.from({length: gridSize}, () => new Array(gridSize).fill(WHITE));
            let bitIdx = 0;
            for (let b of bytes) {
                for (let bitInByte = 0; bitInByte < 8; bitInByte++) {
                    if (bitIdx >= totalBits) break;
                    const y = Math.floor(bitIdx / gridSize);
                    const x = bitIdx % gridSize;
                    const bitVal = msbFirst ? (b >> (7 - bitInByte)) & 1 : (b >> bitInByte) & 1;
                    pd[y][x] = bitVal ? BLACK : WHITE;
                    bitIdx++;
                }
            }
            frames = [{pixelData: pd}];
            historyStacks = [{undoStack: [], redoStack: []}];
            currentFrameIdx = 0;
            renderAll();
            showToast('已导入黑白bit数组');
            return;
        }

        // 彩色数字导入
        const numbers = cleanText.match(/[0-9a-fA-Fx]+/g);
        if (!numbers) return showToast('未识别到数字');
        const parsed = numbers.map(n => parseInt(n, n.startsWith('0x') || n.startsWith('0X') ? 16 : 10));
        const total = gridSize * gridSize;
        const dim3 = text.includes('][') && text.match(/\]\[/g).length >= 2;
        if (dim3 && parsed.length >= total * 2) {
            const fc = Math.floor(parsed.length / total);
            const newFrames = [];
            for (let f = 0; f < fc; f++) {
                const pd = Array.from({length: gridSize}, () => new Array(gridSize).fill(WHITE));
                for (let i = 0; i < total; i++) {
                    const val = parsed[f * total + i];
                    const y = Math.floor(i / gridSize);
                    const x = i % gridSize;
                    pd[y][x] = applyBwFilter(val === 0 ? WHITE : (val === 1 ? BLACK : val));
                }
                newFrames.push({pixelData: pd});
            }
            frames = newFrames;
            historyStacks = newFrames.map(() => ({undoStack: [], redoStack: []}));
            currentFrameIdx = 0;
            renderAll();
            showToast(`导入 ${fc} 帧`);
        } else {
            if (parsed.length < total) return showToast('数据不足');
            const pd = Array.from({length: gridSize}, () => new Array(gridSize).fill(WHITE));
            for (let i = 0; i < total; i++) {
                const val = parsed[i];
                const y = Math.floor(i / gridSize);
                const x = i % gridSize;
                pd[y][x] = applyBwFilter(val === 0 ? WHITE : (val === 1 ? BLACK : val));
            }
            frames = [{pixelData: pd}];
            historyStacks = [{undoStack: [], redoStack: []}];
            currentFrameIdx = 0;
            renderAll();
            showToast('导入单帧');
        }
    };

    document.getElementById('btnExportGIF').onclick=()=>{ if(!frames.length) return; const encoder=new GIFEncoder(gridSize,gridSize); const delay=Math.floor(1000/fps); frames.forEach(f=>encoder.addFrame(f.pixelData,delay)); encoder.loop=0; downloadBlob(encoder.build(),'animation.gif'); showToast('GIF动画 已导出'); };

    function getBitPackBytes(pixelData) {
        const totalBits = gridSize * gridSize;
        const bytes = Math.ceil(totalBits / 8);
        const arr = new Uint8Array(bytes);
        let bitIdx = 0;
        for(let y=0; y<gridSize; y++) {
            for(let x=0; x<gridSize; x++) {
                const byteIdx = Math.floor(bitIdx / 8);
                const bitPos = bitIdx % 8;
                if(pixelData[y][x] !== WHITE) {
                    if(msbFirst) {
                        arr[byteIdx] |= (1 << (7 - bitPos));
                    } else {
                        arr[byteIdx] |= (1 << bitPos);
                    }
                }
                bitIdx++;
            }
        }
        return {arr, bytes};
    }

            frames.forEach((f,fi)=>{

        let text=macro+'const unsigned char animation[FRAME_COUNT][HEIGHT][WIDTH][3] = {\n';
        frames.forEach((f,fi)=>{ text+='  {\n'; for(let y=0;y<gridSize;y++){ const row=[]; for(let x=0;x<gridSize;x++){ const c=f.pixelData[y][x]; row.push('{'+((c>>16)&0xFF)+','+((c>>8)&0xFF)+','+(c&0xFF)+'}'); } text+='    {'+row.join(',')+'}'+(y<gridSize-1?',\n':'\n'); } text+='  }'+(fi<frames.length-1?',\n':'\n'); }); text+='};';
        downloadBlob(new Blob([text],{type:'text/plain'}),'animation.h'); showToast('全部帧RGB数组已导出');
    };

    document.getElementById('btnUndo').onclick=undo;
    document.getElementById('btnRedo').onclick=redo;
    document.getElementById('btnClearFrame').onclick=()=>{ if(confirm('清空当前帧？')){ saveState(); getCurrentFrame().pixelData=Array.from({length:gridSize},()=>new Array(gridSize).fill(WHITE)); renderAll(); } };
    document.getElementById('btnInvert').onclick=()=>{ saveState(); const pd=getCurrentFrame().pixelData; for(let y=0;y<gridSize;y++) for(let x=0;x<gridSize;x++){ let c=pd[y][x]; let r=255-((c>>16)&0xFF),g=255-((c>>8)&0xFF),b=255-(c&0xFF); pd[y][x]=applyBwFilter((r<<16)|(g<<8)|b); } renderAll(); };
    document.getElementById('btnGrid').onclick=()=>{ showGrid=!showGrid; renderCurrentFrame(); };
    document.getElementById('btnAddFrame').onclick=()=>{ frames.push({pixelData:Array.from({length:gridSize},()=>new Array(gridSize).fill(WHITE))}); historyStacks.push({undoStack:[],redoStack:[]}); currentFrameIdx=frames.length-1; renderAll(); };
    document.getElementById('btnDupFrame').onclick=()=>{ const copy=getCurrentFrame().pixelData.map(r=>[...r]); frames.splice(currentFrameIdx+1,0,{pixelData:copy}); historyStacks.splice(currentFrameIdx+1,0,{undoStack:[],redoStack:[]}); currentFrameIdx++; renderAll(); };
    document.getElementById('btnDelFrame').onclick=()=>{ if(frames.length<=1) return showToast('至少保留一帧'); frames.splice(currentFrameIdx,1); historyStacks.splice(currentFrameIdx,1); if(currentFrameIdx>=frames.length) currentFrameIdx=frames.length-1; renderAll(); };
    document.getElementById('btnMoveUp').onclick=()=>{ if(currentFrameIdx<=0) return; [frames[currentFrameIdx],frames[currentFrameIdx-1]]=[frames[currentFrameIdx-1],frames[currentFrameIdx]]; [historyStacks[currentFrameIdx],historyStacks[currentFrameIdx-1]]=[historyStacks[currentFrameIdx-1],historyStacks[currentFrameIdx]]; currentFrameIdx--; renderAll(); };
    document.getElementById('btnMoveDown').onclick=()=>{ if(currentFrameIdx>=frames.length-1) return; [frames[currentFrameIdx],frames[currentFrameIdx+1]]=[frames[currentFrameIdx+1],frames[currentFrameIdx]]; [historyStacks[currentFrameIdx],historyStacks[currentFrameIdx+1]]=[historyStacks[currentFrameIdx+1],historyStacks[currentFrameIdx]]; currentFrameIdx++; renderAll(); };
    document.getElementById('btnPlay').onclick=()=>{ if(playing){ clearInterval(playTimer); playTimer=null; playing=false; document.getElementById('btnPlay').textContent='▶ 播放'; } else { if(frames.length<=1) return showToast('至少2帧'); playing=true; document.getElementById('btnPlay').textContent='⏸ 暂停'; let idx=currentFrameIdx; playTimer=setInterval(()=>{ idx=(idx+1)%frames.length; if(idx===0&&!loop){ clearInterval(playTimer); playing=false; document.getElementById('btnPlay').textContent='▶ 播放'; idx=frames.length-1; } if(playing) switchFrame(idx); },1000/fps); } };
    fpsSlider.oninput=()=>{ fps=parseInt(fpsSlider.value); fpsLabel.textContent=fps; if(playing){ clearInterval(playTimer); document.getElementById('btnPlay').click(); } };
    loopCheck.onchange=()=>{ loop=loopCheck.checked; };

    sizeSelect.onchange=()=>{ resizeAllFrames(parseInt(sizeSelect.value)); };

    document.querySelectorAll('.color-swatch').forEach(s=>{ s.onclick=()=>{ let hex=s.dataset.color; currentColor=parseInt(hex.slice(1),16); document.getElementById('customColor').value=hex; document.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active')); s.classList.add('active'); }; });
    document.getElementById('customColor').oninput=function(){ currentColor=parseInt(this.value.slice(1),16); document.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active')); const match=document.querySelector(`.color-swatch[data-color="${this.value.toUpperCase()}"]`); if(match) match.classList.add('active'); };

    function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500); }

    initFrames(); updateZoom(); updateBitOrderUI(); renderAll(); showToast('🎨 像素动画编辑器就绪');
})();
</script>
</body>
</html>
